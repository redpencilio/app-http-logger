services:
  logstash:
    volumes:
      - ./config/logstash-http/output-to-remote.conf:/pipeline/output-to-remote.conf:ro
    environment:
      REMOTE_HOST: "http://logs.example.com"
      REMOTE_SECRET_KEY: "my-secret-key-change-me"
  stats-logstash:
    volumes:
      - ./config/logstash-stats/output-to-remote.conf:/pipeline/output-to-remote.conf:ro
    environment:
      REMOTE_HOST: "http://logs.example.com"
      REMOTE_SECRET_KEY: "my-secret-key-change-me"
