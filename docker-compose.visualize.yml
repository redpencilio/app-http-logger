x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    volumes:
      - ./data/esdata:/data
    environment:
      path.data: "/data"
      discovery.type: "single-node"
      network.host: "0.0.0.0"
      xpack.security.enabled: false
      xpack.security.enrollment.enabled: false
      http.pipelining.max_events: 100000
      http.max_content_length: "200MB"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    logging: *default-logging
  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.3
    depends_on:
      - elasticsearch
    ports:
      - 127.0.0.1:5601:5601
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    volumes:
      - ./scripts/kibana/:/app/scripts/
    logging: *default-logging
  visualize-scripts:
    image: semtech/mu-scripts:1.0.0
    volumes:
      - ./scripts/visualize-scripts:/app/scripts/
    restart: "no"
