x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  http-logstash:
    volumes:
      - ./config/logstash-http/output-to-file.conf:/pipeline/output-to-file.conf:ro
      - ./data/logs:/data:rw
    environment:
      LOGFILE_FORMAT_STRING: '/data/http-log-%{+YYYY-MM-dd-HH}.json'
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
  stats-logstash:
    volumes:
      - ./config/logstash-stats/output-to-file.conf:/pipeline/output-to-file.conf:ro
      - ./data/logs/stats:/data:rw
    environment:
      LOGFILE_FORMAT_STRING: '/data/stats-%{+YYYY-MM-dd-HH}.json'
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
  docker-logstash:
    volumes:
      - ./config/logstash-docker/output-to-file.conf:/pipeline/output-to-file.conf:ro
      - ./data/logs:/data:rw
    environment:
      LOGFILE_FORMAT_STRING: '/data/docker-log-%{+YYYY-MM-dd-HH}.json'
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
  encrypt:
    image: redpencil/file-encryption-service:1.1.0
    volumes:
      - ./data/logs:/data/logs:rw
      - ./data/encrypted:/data/encrypted:rw
      - ./keys:/keys:ro
    environment:
      ENCRYPT_RECIPIENT: 'info@redpencil.io' # change to your GPG key id
      ENCRYPT_AFTER_MINUTES: 60
      ENCRYPT_GLOB: '/data/logs/http-log-*.json /data/logs/docker-log-*.json'
      ENCRYPTED_DIR: '/data/encrypted'
      #ENCRYPT_INTERVAL: 3600 # default value
    logging: *default-logging
  stats-compress:
    image: redpencil/file-compression-service:1.0.0
    volumes:
      - ./data/logs/stats:/data/logs:rw
      - ./data/compressed/stats:/data/compressed:rw
    environment:
      COMPRESSION_GLOB: '/data/logs/stats-*.json'
    logging: *default-logging
