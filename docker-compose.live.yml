services:
  http-logs-logstash:
    volumes:
      - ./config/http-logs-logstash/output-to-es.conf:/pipeline/output-to-es.conf:ro
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    restart: "always"
  stats-logstash:
    volumes:
      - ./config/stats-logstash/output-to-es.conf:/pipeline/output-to-es.conf:ro
  docker-logs-logstash:
    volumes:
      - ./config/docker-logs-logstash/output-to-es.conf:/pipeline/output-to-es.conf:ro
