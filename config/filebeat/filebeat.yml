filebeat.autodiscover:
  providers:
    - type: docker
      templates:
        - condition:
            has_fields: ['docker.container.labels.logging']
          config:
            - type: filestream
              id: container-${data.docker.container.id}
              prospector.scanner.symlinks: true
              close.on_state_change.removed: false
              parsers:
                - container: ~
              paths:
                - /var/lib/docker/containers/${data.docker.container.id}/*.log

processors:
  - add_docker_metadata: ~

output.logstash:
  hosts: ["docker-logstash:5044"]
