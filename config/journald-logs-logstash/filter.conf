filter {
    if [systemd][unit] == "fail2ban.service" {
        grok {
            patterns_dir => ["/etc/logstash/patterns"]
            match => {
                "message" => [
                    "^%{FAIL2BAN_JAIL} %{IP:[source][ip]} %{FAIL2BAN_ALREADY_BANNED:[event][action]}",
                    "^%{FAIL2BAN_JAIL} %{FAIL2BAN_ACTION:[event][action]} %{IP:[source][ip]}"
                ]
            }
            add_field => {
                "[event][module]" => "fail2ban"
                "[event][dataset]" => "fail2ban.log"
            }
            tag_on_failure => []
        }

        if [event][action] {
            mutate {
                lowercase => ["[event][action]"]
            }
            mutate {
                gsub => ["[event][action]", " ", "_"]
            }
        }

        if [source][ip] {
            geoip {
                id => "geoip_client"
                source => "[source][ip]"
            }
        }
    }
}
